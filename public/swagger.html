<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification System API Documentation</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@3.52.5/swagger-ui.css">
    <style>
        html {
            box-sizing: border-box;
            overflow: -moz-scrollbars-vertical;
            overflow-y: scroll;
        }
        *, *:before, *:after {
            box-sizing: inherit;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background: #fafafa;
        }
        .topbar {
            background-color: #1976d2;
            padding: 20px 0;
            box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.1);
        }
        .topbar-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .topbar h1 {
            margin: 0;
            color: white;
            font-size: 28px;
            font-weight: 300;
        }
        .topbar p {
            margin: 5px 0 0 0;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }
        #swagger-ui {
            max-width: 100%;
            padding: 20px;
        }
        .swagger-ui .topbar {
            display: none;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-inner">
            <h1>🔔 Notification System API</h1>
            <p>Production-ready notification system with asynchronous queue processing and multi-channel support</p>
        </div>
    </div>
    
    <div id="swagger-ui"></div>

    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@3.52.5/swagger-ui-bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@3.52.5/swagger-ui-standalone-preset.js"></script>
    <script>
        window.onload = function() {
            // Build a path that swagger ui will use to make requests
            const ui = SwaggerUIBundle({
                url: "/openapi.json",
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "BaseLayout",
                onComplete: function() {
                    console.log("✅ Swagger UI loaded successfully");
                },
                onFailure: function(err) {
                    console.error("❌ Error loading Swagger UI:", err);
                }
            });
            window.ui = ui;
        };
    </script>
</body>
</html>
