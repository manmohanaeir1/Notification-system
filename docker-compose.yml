version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notification-app
    restart: unless-stopped
    working_dir: /app
    environment:
      - LARAVEL_SKIP_DOCKER_CHECK=true
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=notifications_db
      - DB_USERNAME=notifications_user
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - RABBITMQ_VHOST=/
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    depends_on:
      - mysql
      - redis
      - rabbitmq
    networks:
      - notification-network
    command: php artisan serve --host=0.0.0.0 --port=8000

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notification-queue-worker
    restart: unless-stopped
    working_dir: /app
    environment:
      - LARAVEL_SKIP_DOCKER_CHECK=true
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=notifications_db
      - DB_USERNAME=notifications_user
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - RABBITMQ_VHOST=/
    volumes:
      - ./:/app
    depends_on:
      - mysql
      - redis
      - rabbitmq
    networks:
      - notification-network
    command: php artisan queue:work --queue=notifications --tries=3

  mysql:
    image: mysql:8.0
    container_name: notification-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: notifications_db
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: notifications_user
    ports:
      - "3037:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - notification-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: notification-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - notification-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 20s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: notification-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - notification-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      timeout: 20s
      retries: 10

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:

networks:
  notification-network:
    driver: bridge
